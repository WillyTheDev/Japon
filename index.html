<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗾 Japon — To-Do</title>
<style>
  :root{
    --bg:#0e1117; --bg2:#151a23; --card:#1a212d; --card2:#202935;
    --line:#2a3441; --text:#e6edf3; --muted:#8b98a8;
    --wanted:#ffd166; --wanted-bg:rgba(255,209,102,.08);
    --suggest:#7aa2f7; --suggest-bg:rgba(122,162,247,.06);
    --done:#4ade80; --accent:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1c2534 0%,var(--bg) 55%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;padding-bottom:60px}
  header{padding:40px 20px 20px;text-align:center;border-bottom:1px solid var(--line)}
  h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:0 0 6px;letter-spacing:-.5px}
  .sub{color:var(--muted);font-size:.95rem}
  .legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px;font-size:.85rem}
  .legend span{background:var(--card);border:1px solid var(--line);padding:4px 12px;border-radius:999px}
  .doi{color:var(--wanted)} .dun{color:var(--suggest)} .dok{color:var(--done)}
  .progress{max-width:560px;margin:22px auto 0;padding:0 20px}
  .bar{height:8px;background:var(--card2);border-radius:999px;overflow:hidden}
  .bar>div{height:100%;background:linear-gradient(90deg,#4ade80,#22d3ee);border-radius:999px;transition:width .4s}
  .ptxt{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-top:6px}
  main{max-width:880px;margin:0 auto;padding:10px 16px}
  section{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:18px 0;overflow:hidden}
  section.h{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--card2);border-bottom:1px solid var(--line);font-weight:700;font-size:1.05rem}
  ul{list-style:none;margin:0;padding:10px 6px}
  li{display:flex;align-items:flex-start;gap:12px;padding:9px 12px;border-radius:10px}
  li+li{border-top:1px solid var(--line)}
  li .mark{font-size:1.15rem;line-height:1.4;flex:0 0 auto}
  li .txt{flex:1 1 auto}
  li .txt small{display:block;color:var(--muted);margin-top:1px}
  li.done{opacity:.55}
  li.done .txt{text-decoration:line-through}
  li.done{background:rgba(74,222,128,.05)}
  li.wanted .mark::after, li.suggest .mark::after{display:none}
  li .tag{font-size:.7rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:6px;flex:0 0 auto;margin-top:2px}
  li.wanted .tag{color:var(--wanted);background:var(--wanted-bg);border:1px solid rgba(255,209,102,.25)}
  li.suggest .tag{color:var(--suggest);background:var(--suggest-bg);border:1px solid rgba(122,162,247,.25)}
  footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:30px}
  footer a{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>🗾 Japon — To-Do</h1>
  <div class="sub">Les potes, le plan du voyage — mis à jour en direct depuis le fil Discord.</div>
  <div class="legend">
    <span>✅ fait</span>
    <span class="doi">🎯 prévu — on le veut</span>
    <span class="dun">👀 suggestion — si on a un trou</span>
    <span>🧖 sento tattoo-friendly</span>
  </div>
  <div class="progress">
    <div class="bar"><div id="fill" style="width:0"></div></div>
    <div class="ptxt"><span id="count">…</span><span id="loc">Tokyo & alentours</span></div>
  </div>
</header>
<main id="list"></main>
<footer>Fait avec ❤️ depuis le fil Discord · dernière mise à jour : <span id="date"></span></footer>

const list = document.getElementById('list');
let done=0, total=0;
DATA.forEach(sec=>{
  const s=document.createElement('section');
  const h=document.createElement('div'); h.className='h'; h.textContent=sec.area;
  const ul=document.createElement('ul');
  sec.items.forEach(it=>{
    const isInfo = it.kind==='info';
    if(!isInfo){ total++; if(it.done) done++; }
    const li=document.createElement('li');
    li.className = (it.done?'done ':'')+(it.kind==='suggest'?'suggest':isInfo?'info':'wanted');
    const mark=document.createElement('span'); mark.className='mark'; mark.textContent=it.done?'☑':(isInfo?'ℹ️':'☐');
    const txt=document.createElement('div'); txt.className='txt'; txt.textContent=it.t;
    if(it.s){const sm=document.createElement('small'); sm.textContent=it.s; txt.appendChild(sm);}
    li.appendChild(mark); li.appendChild(txt);
    if(!it.done && !isInfo){
      const tag=document.createElement('span'); tag.className='tag';
      tag.textContent = it.kind==='suggest' ? '👀 si trou' : '🎯 prévu';
      li.appendChild(tag);
    }
    ul.appendChild(li);
  });
  s.appendChild(h); s.appendChild(ul); list.appendChild(s);
});
document.getElementById('fill').style.width = (done/total*100)+'%';
document.getElementById('count').textContent = done+' / '+total+' faits';
const d=new Date();
document.getElementById('date').textContent = d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+' · '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
</script>
</body>
</html>
